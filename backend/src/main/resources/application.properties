spring.application.name=ministock
server.port=${SERVER_PORT:8080}
spring.mvc.problemdetails.enabled=true

# MongoDB Atlas: la URI se entrega siempre por variable de entorno
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:ministock}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Usuario administrador creado al arrancar si no existe
admin.email=${ADMIN_EMAIL:admin@ministock.com}
admin.password=${ADMIN_PASSWORD:admin123}

# CORS para el entorno de desarrollo
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
